name: Open PR for Staged Content

on:
  push:
    branches: ["publish/**"]

jobs:
  open-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Open pull request
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace("refs/heads/", "");

            const existing = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: "open",
            });
            if (existing.data.length > 0) {
              console.log(`PR already open for ${branch}: #${existing.data[0].number}`);
              return;
            }

            const commits = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: branch,
              per_page: 1,
            });
            const commitMessage = commits.data[0]?.commit?.message || "Staged content batch";

            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Review: ${commitMessage.split("\n")[0]}`,
              head: branch,
              base: "main",
              body: [
                "Auto-generated content batch, staged for review before going live.",
                "",
                "```",
                commitMessage,
                "```",
                "",
                "Nothing here is live yet — merging this PR is what publishes it. Delete the branch after merging (or if you decide not to publish it).",
              ].join("\n"),
            });
