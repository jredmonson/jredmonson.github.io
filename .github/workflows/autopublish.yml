name: Autopublish Blog Post

on:
  schedule:
    - cron: '0 11 * * *'   # ~7am ET (EDT, UTC-4)
    - cron: '0 16 * * *'   # ~12pm ET
    - cron: '0 21 * * *'   # ~5pm ET
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate and publish article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/autopublish.py

      - name: Commit and push changes
        run: |
          git config user.name "autopublish-bot"
          git config user.email "actions@users.noreply.github.com"
          git add _posts queue/topic-queue.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Auto-publish: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
