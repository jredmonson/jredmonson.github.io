name: Autopublish Blog Post

on:
  schedule:
    - cron: '0 12 * * 1'   # Weekly, Monday ~7am ET (EDT, UTC-5/4)
  workflow_dispatch:
    inputs:
      count:
        description: 'How many queued topics to publish this run (pillars auto-prioritized before their clusters)'
        required: false
        default: '1'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate and publish article(s)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUBLISH_COUNT: ${{ github.event.inputs.count || '1' }}
        run: python scripts/autopublish.py

      - name: Commit and push changes
        run: |
          git config user.name "autopublish-bot"
          git config user.email "actions@users.noreply.github.com"
          git add _posts queue/topic-queue.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Auto-publish: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
